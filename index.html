<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>БАБЛО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--felt:#0e3b2c;--felt-deep:#082219;--gold:#f2c230;--gold-dark:#b98a0c;--bill:#cfe8b8;--bill-ink:#2f5a3a;--ink:#f4f1df;--line:rgba(244,241,223,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--felt:#0b2f23;--felt-deep:#061a13}}
:root[data-theme="dark"]{--felt:#0b2f23;--felt-deep:#061a13}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 30% 30%,var(--felt) 0%,var(--felt-deep) 85%) fixed;color:var(--ink);
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{display:grid;grid-template-columns:1fr minmax(320px,430px);gap:1.5rem;max-width:1120px;margin:0 auto;padding:1.5rem;min-height:100vh}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3rem;text-align:center}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .2s}
.rank{width:min(340px,100%)}
.rank b{display:block;font-size:1.05rem;margin-bottom:.5rem}
.balance{font-weight:900;font-size:clamp(2.4rem,9vw,4.8rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.balance small{display:block;font-size:1rem;font-weight:500;opacity:.7;letter-spacing:0;margin-top:.6rem}
#bablo{position:relative;font-weight:900;font-size:clamp(2.6rem,12vw,5.5rem);letter-spacing:.02em;color:#3a2a00;padding:.45em 1em;border-radius:999px;
  background:linear-gradient(180deg,#ffe27a 0%,var(--gold) 55%,#e0a91a 100%);
  box-shadow:0 .12em 0 var(--gold-dark),0 .3em .6em rgba(0,0,0,.45),inset 0 .05em 0 rgba(255,255,255,.6);transition:box-shadow .08s}
#bablo.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.92) rotate(-1.5deg)}70%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1)}}
.combo{width:min(340px,100%);font-size:.95rem;opacity:.9}
.combo span{display:block;margin-top:.5rem}
.combo.hot .bar i{background:#ff7a3d}
.msg{margin:0;opacity:.8}
.panel{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.7rem;max-height:calc(100vh - 3rem);overflow:auto}
.tabs{display:flex;gap:.5rem}
.tabs button{flex:1;padding:.6rem;border-radius:10px;background:rgba(244,241,223,.08);font-weight:500}
.tabs button.on{background:var(--gold);color:#3a2a00;font-weight:900}
.upg{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;text-align:left;padding:.75rem .9rem;border-radius:12px;background:rgba(244,241,223,.07);border:1px solid var(--line);width:100%}
.upg b{font-weight:900}.upg small{opacity:.7;grid-column:1}
.upg .price{grid-row:1/3;grid-column:2;align-self:center;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.upg:disabled{opacity:.45;cursor:not-allowed}
.upg.buy{animation:flash .4s}
@keyframes flash{0%{background:rgba(242,194,48,.55)}100%{background:rgba(244,241,223,.07)}}
.quest{padding:.75rem .9rem;border-radius:12px;background:rgba(244,241,223,.07);border:1px solid var(--line);display:flex;flex-direction:column;gap:.45rem}
.quest .row{display:flex;justify-content:space-between;gap:.6rem;align-items:center}
.quest .claim{padding:.4rem .8rem;border-radius:99px;background:var(--gold);color:#3a2a00;font-weight:900;white-space:nowrap}
.quest .claim:disabled{background:rgba(244,241,223,.12);color:var(--ink);opacity:.55;cursor:default}
.quest.done{opacity:.45}.quest.ready{border-color:var(--gold);animation:glow 1.2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(242,194,48,0)}to{box-shadow:0 0 14px rgba(242,194,48,.6)}}
.reset{margin-top:.4rem;background:transparent;opacity:.5;font-size:.85rem;text-decoration:underline;align-self:flex-start}
.bill,.fl,.gold{position:fixed;top:0;left:0;pointer-events:none;z-index:5;will-change:transform,opacity}
.bill{width:84px;height:40px;border-radius:5px;background:var(--bill);color:var(--bill-ink);border:2px solid var(--bill-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;box-shadow:inset 0 0 0 4px rgba(47,90,58,.15)}
.fl{font-weight:900;font-size:1.5rem;color:var(--gold);text-shadow:0 2px 0 #000}
.gold{pointer-events:auto;width:92px;height:46px;border-radius:6px;background:linear-gradient(135deg,#fff0a0,var(--gold),#d8a010);color:#3a2a00;font-weight:900;font-size:1.5rem;box-shadow:0 0 22px rgba(242,194,48,.9);z-index:6}
#toasts{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;z-index:9;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:#12301f;padding:.65rem 1rem;border-radius:12px;font-weight:500;text-align:center;animation:tin .3s ease-out;box-shadow:0 8px 20px rgba(0,0,0,.4)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
body.shake .stage{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
@media (max-width:800px){.app{grid-template-columns:1fr;padding:1rem}.panel{max-height:none}.stage{padding:1.5rem 0}}
@media (prefers-reduced-motion: reduce){#bablo.pop,body.shake .stage,.upg.buy,.quest.ready{animation:none}}
#bablo{font-size:clamp(1.8rem,8vw,4rem);max-width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 70%,#fff) 0%,var(--gold) 55%,color-mix(in srgb,var(--gold) 85%,#000) 100%);color:var(--btn-ink,#3a2a00)}
.emblem{width:150px;height:150px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.35);border:3px solid var(--gold);box-shadow:0 0 22px rgba(0,0,0,.5)}
.emblem svg,.emblem img{display:block;width:100%;height:100%;object-fit:cover}
.pic{background:transparent;font-size:.8rem;opacity:.65;text-decoration:underline;padding:0;margin-top:-.6rem}
.world{display:grid;grid-template-columns:56px 1fr auto;gap:.1rem .8rem;align-items:center;text-align:left;padding:.6rem .8rem;border-radius:12px;background:rgba(244,241,223,.07);border:1px solid var(--line);width:100%}
.world.on{border-color:var(--gold);background:rgba(242,194,48,.14)}
.world .emblem{width:56px;height:56px;border-width:2px;grid-row:1/3;grid-column:1}
.world b{grid-column:2;grid-row:1;font-weight:900}.world small{grid-column:2;grid-row:2;opacity:.7}
.world .go{grid-column:3;grid-row:1/3;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.world:disabled{opacity:.45;cursor:not-allowed}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,230,120,.15) 60%,transparent);pointer-events:none;z-index:7;animation:fx .35s ease-out forwards}
@keyframes fx{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="emblem" id="emblem"></div><button class="pic" id="pic" type="button">своя картинка</button><input type="file" id="file" accept="image/*" hidden><div class="rank"><b id="rank"></b><div class="bar"><i id="rbar"></i></div></div>
    <div class="balance">$<span id="sum">0</span><small id="ps"></small></div>
    <button id="bablo" type="button">БАБЛО</button>
    <div class="combo" id="combo"><div class="bar"><i id="cbar"></i></div><span id="ctext">Жми быстрее — пойдёт комбо</span></div>
    <p class="msg">За клик: <b id="pc"></b></p>
  </main>
  <aside class="panel">
    <div class="tabs"><button type="button" data-t="up" class="on">Прокачки</button><button type="button" data-t="qs">Квесты <span id="qn"></span></button><button type="button" data-t="wd">Миры</button></div>
    <div id="up" style="display:flex;flex-direction:column;gap:.6rem"></div>
    <div id="qs" style="display:none;flex-direction:column;gap:.6rem"></div>
    <div id="wd" style="display:none;flex-direction:column;gap:.6rem"></div>
    <button class="reset" id="mute" type="button">звук: вкл</button>
    <button class="reset" id="reset" type="button">сбросить прогресс</button>
  </aside>
</div>
<div id="toasts"></div>

<script>
(function(){
var KEY='bablo-game-v1',S={m:0,t:0,c:0,lv:{},q:{},best:0};
try{var r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(id){return document.getElementById(id)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(n){if(n<1000)return String(Math.floor(n));var u=['K','M','B','T'],i=-1;while(n>=1000&&i<3){n/=1000;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]}

var UPG=[
 {id:'finger',n:'Стальной палец',d:'+1 к клику',base:15,k:'c',v:1},
 {id:'glove',n:'Золотая перчатка',d:'+10 к клику',base:400,k:'c',v:10},
 {id:'midas',n:'Рука Мидаса',d:'+120 к клику',base:15000,k:'c',v:120},
 {id:'intern',n:'Стажёр',d:'+1 в секунду',base:50,k:'s',v:1},
 {id:'kiosk',n:'Ларёк с шаурмой',d:'+8 в секунду',base:500,k:'s',v:8},
 {id:'crypto',n:'Криптоферма',d:'+50 в секунду',base:4500,k:'s',v:50},
 {id:'offshore',n:'Офшор на Кипре',d:'+400 в секунду',base:40000,k:'s',v:400},
 {id:'bank',n:'Свой банк',d:'+3000 в секунду',base:350000,k:'s',v:3000}
];
var RANKS=[[0,'Нищеброд'],[500,'Студент с подработкой'],[5000,'Фрилансер'],[50000,'Бизнесмен'],[1e6,'Олигарх'],[1e8,'Повелитель бабла']];
var QUESTS=[
 {id:'q1',n:'Разогрев: нажми 25 раз',k:'c',g:25,r:100},
 {id:'q2',n:'Первая тысяча: заработай $1K',k:'t',g:1000,r:500},
 {id:'q3',n:'Шопоголик: купи 5 прокачек',k:'b',g:5,r:400},
 {id:'q4',n:'Пассивка: доход $10 в секунду',k:'s',g:10,r:1000},
 {id:'q5',n:'Комбо-мастер: комбо 30',k:'m',g:30,r:2000},
 {id:'q6',n:'Упорство: нажми 300 раз',k:'c',g:300,r:3000},
 {id:'q7',n:'Серьёзный игрок: заработай $50K',k:'t',g:50000,r:10000},
 {id:'q8',n:'Империя: купи 25 прокачек',k:'b',g:25,r:15000},
 {id:'q9',n:'Денежный поток: $300 в секунду',k:'s',g:300,r:40000},
 {id:'q10',n:'Миллионер: заработай $1M',k:'t',g:1e6,r:250000}
];
var pc=1,ps=0,combo=0,last=0,rankIdx=-1;
function lv(u){return S.lv[u.id]||0}
function cost(u){return Math.ceil(u.base*Math.pow(1.15,lv(u)))}
function calc(){pc=1;ps=0;UPG.forEach(function(u){if(u.k==='c')pc+=u.v*lv(u);else ps+=u.v*lv(u)})}
function bought(){return UPG.reduce(function(a,u){return a+lv(u)},0)}
function earn(a){S.m+=a;S.t+=a}
function toast(t){var e=el('div','toast',t);$('toasts').appendChild(e);setTimeout(function(){e.remove()},2600)}

function bill(){
  var e=el('div','bill',window.__sym||'$'),w=innerWidth,h=innerHeight,x=Math.random()*(w-84),d=(Math.random()-.5)*160;
  document.body.appendChild(e);
  var a=e.animate([{transform:'translate('+x+'px,-60px) rotate(0deg)',opacity:1},{transform:'translate('+(x+d)+'px,'+(h+60)+'px) rotate('+((Math.random()-.5)*160)+'deg)',opacity:.9}],{duration:1500+Math.random()*1300,easing:'cubic-bezier(.4,.1,.7,1)'});
  a.onfinish=function(){e.remove()};
}
function rain(n){if(reduce)return;for(var i=0;i<n;i++)setTimeout(bill,i*40)}
function floatTxt(x,y,t){
  if(reduce)return;var e=el('div','fl',t);document.body.appendChild(e);
  var a=e.animate([{transform:'translate('+x+'px,'+y+'px)',opacity:1},{transform:'translate('+(x+(Math.random()-.5)*60)+'px,'+(y-90)+'px)',opacity:0}],{duration:900,easing:'ease-out'});
  a.onfinish=function(){e.remove()};
}

var btn=$('bablo');
btn.addEventListener('click',function(e){
  var now=Date.now();combo=(now-last<650)?Math.min(combo+1,40):1;last=now;if(combo>S.best)S.best=combo;
  var mult=1+Math.floor(combo/10)*0.5,gain=Math.round(pc*mult),crit=Math.random()<.08;if(crit)gain*=5;
  earn(gain);S.c++;
  var b=btn.getBoundingClientRect(),x=e.clientX||(b.left+b.width/2),y=e.clientY||b.top;
  floatTxt(x-20,y-20,(crit?'КРИТ! ':'')+'+$'+fmt(gain)+(mult>1?' x'+mult:''));sfx(crit?'crit':'click');if(crit)flash();
  btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');
  rain(Math.min(4+Math.floor(combo/3),16));
  update();
});

var upEls={},qEls={};
UPG.forEach(function(u){
  var b=el('button','upg'),n=el('b','',''),d=el('small','',u.d),p=el('span','price','');
  b.type='button';b.appendChild(n);b.appendChild(p);b.appendChild(d);$('up').appendChild(b);upEls[u.id]={b:b,n:n,p:p};
  b.addEventListener('click',function(){
    var c=cost(u);if(S.m<c)return;S.m-=c;S.lv[u.id]=lv(u)+1;calc();
    b.classList.remove('buy');void b.offsetWidth;b.classList.add('buy');sfx('buy');rain(6);update();
  });
});
QUESTS.forEach(function(q){
  var box=el('div','quest'),row=el('div','row'),t=el('span','',q.n),c=el('button','claim','+$'+fmt(q.r)),bar=el('div','bar'),i=el('i');
  c.type='button';row.appendChild(t);row.appendChild(c);bar.appendChild(i);box.appendChild(row);box.appendChild(bar);$('qs').appendChild(box);qEls[q.id]={box:box,c:c,i:i};
  c.addEventListener('click',function(){
    if(S.q[q.id]||prog(q)<q.g)return;S.q[q.id]=1;earn(q.r);
    toast('Квест выполнен: +$'+fmt(q.r));sfx('quest');rain(18);if(!reduce){document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake')},450)}
    update();
  });
});
function prog(q){return q.k==='c'?S.c:q.k==='t'?S.t:q.k==='b'?bought():q.k==='s'?ps:S.best}

function update(){
  $('sum').textContent=fmt(S.m);$('pc').textContent='$'+fmt(pc);
  $('ps').textContent=ps?'+$'+fmt(ps)+' в секунду':'пассивного дохода пока нет';
  var ri=0;RANKS.forEach(function(r,i){if(S.t>=r[0])ri=i});
  var lo=RANKS[ri][0],hi=RANKS[ri+1]?RANKS[ri+1][0]:null;
  $('rank').textContent=RANKS[ri][1];$('rbar').style.width=hi?Math.min(100,(S.t-lo)/(hi-lo)*100)+'%':'100%';
  if(rankIdx>=0&&ri>rankIdx){toast('Новое звание: '+RANKS[ri][1]);rain(24);if(!reduce){document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake')},450)}}
  rankIdx=ri;
  var mult=1+Math.floor(combo/10)*0.5;
  $('cbar').style.width=(combo/40*100)+'%';$('combo').classList.toggle('hot',mult>1);
  $('ctext').textContent=combo>1?'Комбо '+combo+(mult>1?' · доход x'+mult:' · до x1.5 ещё '+(10-combo)):'Жми быстрее — пойдёт комбо';
  UPG.forEach(function(u){var e=upEls[u.id],c=cost(u);e.n.textContent=u.n+(lv(u)?' · ур. '+lv(u):'');e.p.textContent='$'+fmt(c);e.b.disabled=S.m<c});
  var ready=0;
  QUESTS.forEach(function(q){
    var e=qEls[q.id],p=Math.min(prog(q),q.g),done=!!S.q[q.id],can=!done&&p>=q.g;
    e.i.style.width=(p/q.g*100)+'%';e.box.classList.toggle('done',done);e.box.classList.toggle('ready',can);
    e.c.disabled=!can;e.c.textContent=done?'готово':'+$'+fmt(q.r);if(can)ready++;
  });
  $('qn').textContent=ready?'('+ready+')':'';
}

document.querySelectorAll('.tabs button').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tabs button').forEach(function(o){o.classList.toggle('on',o===t)});
    $('up').style.display=t.dataset.t==='up'?'flex':'none';$('qs').style.display=t.dataset.t==='qs'?'flex':'none';$('wd').style.display=t.dataset.t==='wd'?'flex':'none';
  });
});

function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
setInterval(function(){
  if(ps)earn(ps/10);
  if(combo&&Date.now()-last>800)combo=0;
  update();
},100);
setInterval(save,2000);

function goldBill(){
  var e=el('button','gold','$'),w=innerWidth,y=80+Math.random()*(innerHeight-220);
  e.type='button';e.setAttribute('aria-label','Золотая купюра');document.body.appendChild(e);
  var a=e.animate([{transform:'translate(-110px,'+y+'px) rotate(-8deg)'},{transform:'translate('+(w*.5)+'px,'+(y-50)+'px) rotate(8deg)'},{transform:'translate('+(w+110)+'px,'+y+'px) rotate(-8deg)'}],{duration:9000,easing:'linear'});
  a.onfinish=function(){e.remove()};
  e.addEventListener('click',function(){
    var g=Math.max(200,Math.round(ps*30+pc*50));earn(g);toast('Золотая купюра: +$'+fmt(g));rain(20);a.cancel();e.remove();update();
  });
}
(function loop(){setTimeout(function(){goldBill();loop()},20000+Math.random()*20000)})();
setTimeout(goldBill,12000);

$('reset').addEventListener('click',function(){
  var b=$('reset');
  if(b.dataset.s){S={m:0,t:0,c:0,lv:{},q:{},best:0};calc();save();rankIdx=-1;if(window.__bw)window.__bw();b.dataset.s='';b.textContent='сбросить прогресс';update();return}
  b.dataset.s='1';b.textContent='точно сбросить? нажми ещё раз';setTimeout(function(){b.dataset.s='';b.textContent='сбросить прогресс'},3000);
});
var WORLDS=[
{id:'classic',n:'Классика',d:'Зелёное сукно и золото',cost:0,btn:'БАБЛО',sym:'$',c:['#0e3b2c','#082219','#f2c230','#b98a0c'],ink:'#3a2a00',b:['#cfe8b8','#2f5a3a'],svg:`<circle cx='50' cy='50' r='32' fill='#f2c230'/><text x='50' y='64' text-anchor='middle' font-size='42' font-weight='900' fill='#3a2a00'>$</text>`},
{id:'m67',n:'6 7',d:'Мем, который не объяснить',cost:67,btn:'SIX SEVEN',sym:'67',c:['#2a1060','#0c0624','#35e0ff','#0a8fa8'],ink:'#06222a',b:['#f6c8ff','#6a1b8a'],svg:`<text x='50' y='66' text-anchor='middle' font-size='46' font-weight='900' fill='#ff4fd8' stroke='#35e0ff' stroke-width='2'>67</text>`},
